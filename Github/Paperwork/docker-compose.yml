# PDF Workplace — production-grade deployment with Docker Compose.
#
# Setup:
#   cp .env.example .env
#   Set strong secrets in .env (SESSION_SECRET, STORAGE_ENCRYPTION_KEY, POSTGRES_PASSWORD).
#
# Run:
#   docker compose up --build
#
# Volumes:
#   paperwork-db  — persistent PostgreSQL data (documents, user/job records).
#   paperwork-data — persistent data directory for the app (generated files, logs, etc.).
#
# In production, terminate TLS at a trusted reverse proxy and use an
# HTTPS PUBLIC_BASE_URL with COOKIE_SECURE=true.

services:
  db:
    image: postgres:17-alpine
    container_name: paperwork_db
    environment:
      POSTGRES_DB: paperwork
      POSTGRES_USER: paperwork
      # Local evaluation only; set a strong password for any shared deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperwork-local-only}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - paperwork-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperwork -d paperwork"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: paperwork_app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://paperwork:${POSTGRES_PASSWORD:-paperwork-local-only}@db:5432/paperwork}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://info.pdf.infoorigin.com}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      LOCAL_ADMIN_USERNAME: ${LOCAL_ADMIN_USERNAME:-}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-}
      MAX_STORAGE_BYTES_PER_USER: ${MAX_STORAGE_BYTES_PER_USER:-1073741824}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      MAX_TOTAL_UPLOAD_BYTES: ${MAX_TOTAL_UPLOAD_BYTES:-104857600}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - paperwork-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  paperwork-db:
  paperwork-data:
