# Reverse proxy for the Paperwork app (Docker Compose).
# Place this on your on-prem server (e.g. as /etc/nginx/sites-available/paperwork)
# and enable it for the domain info.pdf.infoorigin.com, then restart nginx.
#
# Adjust the proxy target to match how Paperwork runs there:
#   - with the new compose file: paperless on 127.0.0.1:8000, or the container IP
#   - if running a container:   docker ps to find the port mapping, e.g. 0.0.0.0:8000->8000
#
# If you use Let's Encrypt, adapt the ssl_certificate paths to your live directory.

server {
    listen 443 ssl;
    server_name info.pdf.infoorigin.com;

    ssl_certificate     /etc/letsencrypt/live/info.pdf.infoorigin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/info.pdf.infoorigin.com/privkey.pem;
    # Optional: point at a hardened ssl parameters file.
    # include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://127.0.0.1:8000;  # Paperwork app (port 8000)

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app reads large uploads (50 MB); nginx default is often 1 MB.
        client_max_body_size 60m;

        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}

# Optional: redirect HTTP traffic to HTTPS.
server {
    listen 80;
    server_name info.pdf.infoorigin.com;
    return 301 https://$host$request_uri;
}
